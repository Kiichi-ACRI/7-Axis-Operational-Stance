<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>思想家診断</title>
<style>
body { 
  font-family: sans-serif; 
  max-width: 700px; 
  margin: 40px auto; 
  background: #f7faff;
  line-height: 1.6;
}

  h1 { margin-bottom: 10px; }

  .axis-block { 
    margin-bottom: 10px;
    background: #f7f7f7;
    padding: 12px 15px;
    border-radius: 8px;
  }

  select { margin-left: 10px; }

  #result { 
    white-space: pre-wrap; 
    background: #fff; 
    padding: 20px; 
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  button {
    margin-top: 20px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover {
    background: #4338ca;
  }

  #radarChart {
    margin-top: 30px;
  }
</style>
</head>
<body>

  <h1>思想家診断</h1>

  <label>
    言語:
    <select id="lang">
      <option value="jp">日本語</option>
      <option value="en">English</option>
    </select>
  </label>

  <h2>質問</h2>

  <div style="background:#f0f0f0; padding:10px; border-radius:8px; margin-bottom:20px;">
    <strong>A / C / B の意味</strong><br>
    A = 軸のマイナス方向（例：個人・暴力・地方・弱い執行・循環・虚軸・批判）<br>
    C = 中央（中立）<br>
    B = 軸のプラス方向（例：集団・法治・中央・強い執行・進歩・実軸・正統）
  </div>

  <div id="questions"></div>

  <button id="run">診断する</button>

  <h2>結果</h2>
  <div id="result"></div>

  <!-- ★ レーダーチャート描画領域 ★ -->
  <canvas id="radarChart" width="400" height="400"></canvas>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 診断ロジック -->
  <script src="app.js"></script>

</body>
</html>
